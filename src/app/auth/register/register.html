@if (show_register_form) {
  <form class="w-100" [formGroup]="registerForm">
    <div class="text-center mb-10">
      <h1 class="text-dark fw-bolder mb-3">Register</h1>
    </div>

    <div class="mb-3 p-relative">
      <label class="form-label fs-6 fw-bolder text-dark">First Name</label>
      <input formControlName="firstName" class="form-control form-control-lg form-control-solid"
        type="text" name="firstName" placeholder="Enter your first name">
    </div>

    <div class="mb-3 p-relative">
      <label class="form-label fs-6 fw-bolder text-dark">Last Name</label>
      <input formControlName="lastName" class="form-control form-control-lg form-control-solid"
        type="text" name="lastName" placeholder="Enter your last name">
    </div>

    <div class="p-relative" [ngClass]="is_email_registered ? 'mb-10' : 'mb-3'">
      <label class="form-label fs-6 fw-bolder text-dark">Email</label>
      <input formControlName="email" class="form-control form-control-lg form-control-solid"
        [ngClass]="is_email_registered ? 'is-invalid' : ''" (focusout)="checkEmail()"
        type="text" name="email" placeholder="Enter your email">

      @if (is_email_registered) {
        <div class="invalid-feedback">
          <div>This email is already registered!</div>
        </div>
      }
    </div>

    <div class="mb-10 p-relative">
      <label class="form-label fw-bolder fs-6 text-dark">Password</label>
      <div class="d-flex flex-stack form-group p-relative">
        <input [type]="password_input_type_text ? 'text' : 'password'"
          formControlName="password"
          class="form-control form-control-lg form-control-solid"
          name="password"
          autocomplete="new-password"
          placeholder="Enter your password">

        <i class="bi cursor-pointer suffix-icon"
          [ngClass]="password_input_type_text ? 'bi-eye-slash-fill' : 'bi-eye-fill'"
          (click)="password_input_type_text = !password_input_type_text"></i>
      </div>
    </div>

    <div class="mb-2 p-relative text-center">
      <button type="button" class="btn btn-lg btn-spacex w-100"
        (click)="register()" [disabled]="registerForm.invalid || is_email_registered">
        Register
      </button>
    </div>

    <div class="mb-0 p-relative">
      <div class="d-flex flex-stack mb-2">
        <span class="fs-6 text-dark">Already have an account?</span>

        <span [routerLink]="'/auth/login'"
          class="text-dark fs-6 fw-bolder cursor-pointer">
          Login
        </span>
      </div>
    </div>
  </form>
}

@if (successful_register) {
  <div class="text-center mb-10">
    <h1 class="text-dark fw-bolder mb-3">Your account has been created successfully.</h1>
    <p class="fs-6 text-dark mb-0">Please verify your email account.</p>
  </div>

  <div class="text-center">
    <span class="fs-6 text-dark me-1">Didn't receive the verification email?</span>

    <span (click)="resendVerificationEmail()" class="text-dark fs-6 fw-bolder cursor-pointer">
      Send again
    </span>
  </div>
}
