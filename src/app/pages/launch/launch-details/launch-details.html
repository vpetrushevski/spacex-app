@if(show_spinner) {
<div class="custom-spinner-wrapper">
  <mat-spinner class="custom-spinner" strokeWidth="1" [diameter]="65"></mat-spinner>
</div>
}

@if (!show_spinner && launchData) {
<div class="row g-5">

  <div class="col-12">
    <app-launch-info-card
      [launch]="launchData"
      [crewMembersCount]="crewMembers.length"
      [shipsCount]="ships.length">
    </app-launch-info-card>
  </div>

  <div class="col-12 col-lg-6 col-xl-4">
    <app-rocket-card [rocket]="rocket"></app-rocket-card>
  </div>

  <div class="col-12 col-lg-6 col-xl-4">
    <app-capsule-card [capsules]="capsules"></app-capsule-card>
  </div>

  <div class="col-12 col-lg-6 col-xl-4">
    <app-crew-card [crewMembers]="crewMembers"></app-crew-card>
  </div>

  <div class="col-12 col-lg-6 col-xl-4">
    <app-ship-card [ships]="ships"></app-ship-card>
  </div>

  <div class="col-12 col-lg-6 col-xl-4">
    <app-launchpad-card [launchpad]="launchpad"></app-launchpad-card>
  </div>

  <div class="col-12 col-lg-6 col-xl-4">
    <app-landpad-card [landpads]="landpads"></app-landpad-card>
  </div>

</div>
}
