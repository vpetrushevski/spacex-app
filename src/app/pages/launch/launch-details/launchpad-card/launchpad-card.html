<div class="card h-100">
  <div class="card-header border-0 pt-5">
    <h3 class="card-title fw-bold fs-2">Launchpad</h3>
  </div>

  <div class="card-body">
    @if (launchpad) {
    <img
      [src]="launchpad.images.large?.[0] || 'assets/img/no-image.png'"
      class="img-fluid rounded mb-4 details-image"
      alt="Launchpad">

    <h4 class="fw-bolder">{{ launchpad.name }}</h4>
    <p class="text-muted">{{ launchpad.fullName }}</p>

    <span class="badge badge-light-success me-2">{{ launchpad.status }}</span>
    <span class="badge badge-light-primary">{{ launchpad.region }}</span>

    <div class="separator my-4"></div>

    <p class="text-muted">
      {{ launchpad.details || 'No launchpad details available.' }}
    </p>
    } @else {
    <div class="d-flex flex-column justify-content-center align-items-center h-100 py-10">
      <i class="bi bi-geo-alt text-gray-400 mb-5" style="font-size: 64px;"></i>
      <span class="text-muted fs-5 text-center">No launchpad information available.</span>
    </div>
    }
  </div>
</div>
