<div class="card h-100">
  <div class="card-header border-0 pt-5">
    <h3 class="card-title fw-bold fs-2">Crew Members</h3>
  </div>

  <div class="card-body">
    @if (crewMembers.length) {
    @for (member of crewMembers; track member.id) {
    <div class="d-flex align-items-center mb-5">
      <img
        [src]="member.image || 'assets/img/no-image.png'"
        class="crew-avatar me-4"
        alt="Crew member">

      <div>
        <h5 class="fw-bolder mb-1">
          {{ member.name }}
        </h5>

        <span class="text-muted d-block">
          {{ member.agency }}
        </span>

        <span class="badge badge-light-success">
          {{ member.status }}
        </span>
      </div>
    </div>
    }
    } @else {
    <div class="d-flex flex-column justify-content-center align-items-center h-100 py-10">
      <i class="bi bi-people text-gray-400 mb-5"
         style="font-size: 64px;"></i>

      <span class="text-muted fs-5 text-center">
        No crew information available.
      </span>
    </div>
    }
  </div>
</div>
