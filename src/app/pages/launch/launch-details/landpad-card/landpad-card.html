<div class="card h-100">
  <div class="card-header border-0 py-4">
    <h3 class="card-title fw-bold fs-2">Landpad</h3>
  </div>

  <div class="card-body">
    @if (landpads.length) {
    @for (landpad of landpads; track landpad.id) {
    <div class="mb-5">
      <img
        [src]="landpad.images.large[0] || 'assets/img/no-image.png'"
        class="img-fluid rounded mb-4 details-image"
        alt="Landpad">

      <h4 class="fw-bolder">{{ landpad.name }}</h4>
      <p class="text-muted">{{ landpad.fullName }}</p>

      <span class="badge badge-light-info me-2">{{ landpad.type }}</span>
      <span class="badge badge-light-success">{{ landpad.status }}</span>

      <div class="separator my-4"></div>

      <p class="text-muted">
        {{ landpad.details || 'No landpad details available.' }}
      </p>
    </div>
    }
    } @else {
    <div class="d-flex flex-column justify-content-center align-items-center h-100 py-10">
      <i class="bi bi-pin-map text-gray-400 mb-5" style="font-size: 64px;"></i>
      <span class="text-muted fs-5 text-center">No landpad information available.</span>
    </div>
    }
  </div>
</div>
