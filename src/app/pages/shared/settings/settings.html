@if (show_spinner) {
  <div class="custom-spinner-wrapper">
    <mat-spinner class="custom-spinner" strokeWidth="1" [diameter]="65"></mat-spinner>
  </div>
}

<div class="modal-content">
  <div class="modal-header text-white bg-spacex-primary">
    <h1 class="fs-2 fw-600 m-0">Change Password</h1>
    <div class="btn btn-sm btn-icon text-white box-shadow-none" mat-dialog-close>
      <span class="svg-icon svg-icon-1">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect opacity="0.5" x="6" y="17.3137" width="16" height="2" rx="1" transform="rotate(-45 6 17.3137)" fill="currentColor"></rect>
          <rect x="7.41422" y="6" width="16" height="2" rx="1" transform="rotate(45 7.41422 6)" fill="currentColor"></rect>
        </svg>
      </span>
    </div>
  </div>

  <div class="modal-body py-10 px-lg-17">
    <form [formGroup]="changePasswordForm">
      <div class="mb-10 p-relative">
        <div class="d-flex flex-stack mb-2">
          <label class="form-label fw-bolder fs-6 text-dark">Current Password</label>
        </div>

        <div class="d-flex flex-stack form-group p-relative">
          <input [type]="current_password_input_type_text ? 'text' : 'password'" formControlName="currentPassword" class="form-control form-control-lg form-control-solid"
            [ngClass]="is_current_password_correct ? '' : 'is-invalid-password'" name="currentPassword" autocomplete="new-password" placeholder="Enter your password">

          <i class="bi cursor-pointer suffix-icon" [ngClass]="current_password_input_type_text ? 'bi-eye-slash-fill' : 'bi-eye-fill'"
            (click)="current_password_input_type_text = !current_password_input_type_text"></i>

          @if (!is_current_password_correct) {
            <div class="invalid-feedback-password">
              <div>Password is incorrect!</div>
            </div>
          }
        </div>
      </div>

      <div class="mb-10 p-relative">
        <label class="form-label fs-6 fw-bolder text-dark">New Password</label>

        <div class="d-flex flex-stack form-group p-relative">
          <input [type]="new_password_input_type_text ? 'text' : 'password'" formControlName="newPassword" class="form-control form-control-lg form-control-solid"
            [ngClass]="new_password.errors?.['pattern'] ? 'is-invalid-password' : ''" name="newPassword" autocomplete="new-password" placeholder="Enter your new password">

          <i class="bi cursor-pointer suffix-icon" [ngClass]="new_password_input_type_text ? 'bi-eye-slash-fill' : 'bi-eye-fill'"
            (click)="new_password_input_type_text = !new_password_input_type_text"></i>

          @if (new_password.errors?.['pattern']) {
            <div class="invalid-feedback-password">
              <div>Use 8 to 15 characters, at least one uppercase letter, one number, and one special character!</div>
            </div>
          }
        </div>
      </div>

      <div class="p-relative">
        <label class="form-label fs-6 fw-bolder text-dark">Confirm Password</label>

        <div class="d-flex flex-stack form-group p-relative">
          <input [type]="confirm_password_input_type_text ? 'text' : 'password'" formControlName="confirmPassword" class="form-control form-control-lg form-control-solid"
            [ngClass]="new_password_match ? '' : 'is-invalid-password'" name="confirmPassword" autocomplete="new-password" placeholder="Re-enter your new password">

          <i class="bi cursor-pointer suffix-icon" [ngClass]="confirm_password_input_type_text ? 'bi-eye-slash-fill' : 'bi-eye-fill'"
            (click)="confirm_password_input_type_text = !confirm_password_input_type_text"></i>

          @if (!new_password_match) {
            <div class="invalid-feedback-password">
              <div>Passwords do not match!</div>
            </div>
          }
        </div>
      </div>
    </form>
  </div>

  <div class="modal-footer justify-content-between">
    <button class="btn btn-lg btn-light" mat-dialog-close>Close</button>
    <button class="btn btn-lg btn-spacex" [disabled]="changePasswordForm.invalid || !new_password_match" (click)="changePassword()">Save Password</button>
  </div>
</div>
